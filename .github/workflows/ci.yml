name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test -- --watch=false

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet format --verify-no-changes
      - name: Build (warnings fail it, including NuGet vulnerability audit warnings)
        run: dotnet build -warnaserror
      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project FiveStack.Api --no-build
      - name: Test (Testcontainers starts Postgres in Docker)
        run: dotnet test --no-build --collect:"XPlat Code Coverage" --results-directory ../coverage
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGithub
          classfilters: "-FiveStack.Api.Data.Migrations.*"
      - run: cat ../coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  # Builds the production image (so a broken Dockerfile fails here, not on Render) and runs Playwright against it.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fivestack
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start app + Postgres
        run: |
          docker compose --profile app up -d --no-build
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/api/health
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Playwright
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: App logs
        if: failure()
        run: docker compose --profile app logs app
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
